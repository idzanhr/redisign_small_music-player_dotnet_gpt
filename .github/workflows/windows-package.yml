name: Build Windows package

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and package for Windows 11
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish self-contained Windows app
        run: dotnet publish MusicRoom.csproj --configuration Release --runtime win-x64 --self-contained true --output publish -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true

      - name: Sign released executable
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_CERTIFICATE_BASE64) -or [string]::IsNullOrWhiteSpace($env:SIGNING_CERTIFICATE_PASSWORD)) {
            throw "Add the WINDOWS_SIGNING_CERTIFICATE_BASE64 and WINDOWS_SIGNING_CERTIFICATE_PASSWORD repository secrets before creating a signed release."
          }

          $certificatePath = Join-Path $env:RUNNER_TEMP "musicroom-signing.pfx"
          try {
            [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:SIGNING_CERTIFICATE_BASE64))
            $sdkBin = Join-Path ([Environment]::GetFolderPath("ProgramFilesX86")) "Windows Kits\10\bin"
            $signTool = Get-ChildItem -Path $sdkBin -Filter signtool.exe -Recurse -ErrorAction Stop |
              Where-Object { $_.FullName -match "\\x64\\signtool\.exe$" } |
              Sort-Object -Property FullName -Descending |
              Select-Object -First 1
            if (-not $signTool) { throw "SignTool was not found in the Windows SDK." }

            & $signTool.FullName sign /fd SHA256 /td SHA256 /tr "http://timestamp.digicert.com" /f $certificatePath /p $env:SIGNING_CERTIFICATE_PASSWORD "publish\MusicRoom.exe"
            if ($LASTEXITCODE -ne 0) { throw "SignTool failed to sign MusicRoom.exe." }
            & $signTool.FullName verify /pa /v "publish\MusicRoom.exe"
            if ($LASTEXITCODE -ne 0) { throw "SignTool could not verify the MusicRoom.exe signature." }
          }
          finally {
            Remove-Item -LiteralPath $certificatePath -Force -ErrorAction SilentlyContinue
          }

      - name: Create ZIP package
        shell: pwsh
        run: Compress-Archive -Path "publish\*" -DestinationPath "MusicRoom-win-x64.zip" -CompressionLevel Optimal

      - name: Upload package to workflow run
        uses: actions/upload-artifact@v4
        with:
          name: MusicRoom-win-x64
          path: MusicRoom-win-x64.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: MusicRoom-win-x64.zip

